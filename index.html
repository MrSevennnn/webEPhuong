  <title>Timemark — Chấm công</title>
  <style>
    :root{color-scheme:dark;--green:#00b14f;--blue:#1976d2;--ink:#eef3f8;--muted:#9ba8b6;--panel:#111821;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090d12;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{touch-action:manipulation;overscroll-behavior:none}
    button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
    .app{height:100vh;height:100dvh;width:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));gap:12px;background:radial-gradient(ellipse at 50% 0%,#17212c 0%,#0c1118 48%,#080b10 100%)}
    .topbar{width:min(100%,760px);min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#22d879,#008e45);display:grid;place-items:center;box-shadow:0 5px 18px #00b14f30}.brand-mark svg{width:21px;height:21px}.brand-copy{line-height:1.1}.brand-copy strong{font-size:15px;letter-spacing:.01em}.brand-copy small{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .top-actions{display:flex;align-items:center;gap:7px}.tool-btn{min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:#dbe4ee;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:600;white-space:nowrap;transition:background .18s,border-color .18s}.tool-btn:hover{background:#ffffff12;border-color:#ffffff25}.tool-btn:active{transform:scale(.98)}.tool-btn svg{width:16px;height:16px;opacity:.9}.tool-btn .tool-label{display:inline}.tool-btn.primary{border-color:#00b14f55;color:#aaffcf;background:#00b14f12}
    .stage-wrap{min-height:0;flex:1;width:100%;display:grid;place-items:center;position:relative}.stage{position:relative;width:min(100%, calc((100dvh - 188px)*.75));height:auto;aspect-ratio:3/4;max-height:100%;overflow:hidden;border-radius:20px;background:#151b22;box-shadow:0 22px 70px #0009,0 0 0 1px #ffffff16;isolation:isolate}.stage canvas{display:block;width:100%;height:100%;object-fit:cover}.video-source{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.camera-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;background:radial-gradient(circle at 50% 35%,#283543,#141b24 65%,#0e131a);z-index:0}.camera-placeholder.hidden{display:none}.camera-icon{width:74px;height:74px;border-radius:24px;background:#ffffff0d;border:1px solid #ffffff18;display:grid;place-items:center;color:#b7c5d3;margin-bottom:18px}.camera-icon svg{width:34px;height:34px}.camera-placeholder h1{font-size:21px;margin:0 0 8px}.camera-placeholder p{max-width:290px;color:#a9b6c4;font-size:14px;line-height:1.5;margin:0}.start-camera{margin-top:20px;min-height:48px;padding:0 20px;border-radius:14px;background:#00b14f;color:#fff;font-weight:750;box-shadow:0 8px 24px #00b14f38}.status-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,360px);padding:14px 16px;border-radius:14px;background:#111aeeed;border:1px solid #ffffff23;color:#fff;font-size:13px;line-height:1.45;text-align:center;box-shadow:0 10px 35px #0008;z-index:3;display:none}.status-toast.show{display:block}
    .controls{width:min(100%,760px);display:flex;align-items:center;justify-content:center;gap:18px;flex-shrink:0;min-height:84px}.mode-switch{height:52px;padding:4px;border-radius:28px;background:#171f29;border:1px solid #ffffff12;display:flex;align-items:center;gap:3px;box-shadow:inset 0 1px #ffffff08}.mode-option{height:42px;min-width:110px;padding:0 18px;border-radius:23px;background:transparent;color:#aeb9c5;font-weight:700;font-size:14px;transition:all .2s}.mode-option.active[data-mode="in"]{background:var(--green);color:#fff;box-shadow:0 4px 16px #00b14f44}.mode-option.active[data-mode="out"]{background:var(--blue);color:#fff;box-shadow:0 4px 16px #1976d244}.shutter{width:76px;height:76px;flex:0 0 76px;padding:6px;border-radius:50%;background:transparent;border:2px solid #f5f7fa;box-shadow:0 0 0 4px #ffffff15;display:grid;place-items:center;transition:transform .14s,box-shadow .18s}.shutter:active{transform:scale(.94)}.shutter span{width:100%;height:100%;border-radius:50%;background:#f5f7fa;display:grid;place-items:center;color:#0b1118}.shutter svg{width:25px;height:25px}.shutter.busy span{background:#ff6b6b;color:#fff}
    .hint{font-size:11px;color:#788594;text-align:center;margin-top:-8px;flex-shrink:0}
    .modal{position:fixed;inset:0;z-index:10;background:#05080dd9;backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}.modal.open{display:flex}.modal-card{width:min(100%,520px);max-height:100%;overflow:auto;border:1px solid #ffffff17;border-radius:22px;background:#121922;box-shadow:0 28px 90px #000b;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{font-size:17px;margin:0}.close-btn{width:40px;height:40px;border-radius:12px;background:#ffffff0c;color:#dfe7ef;font-size:23px}.preview-image{width:100%;display:block;aspect-ratio:3/4;object-fit:contain;background:#080b10;border-radius:14px}.modal-actions{display:flex;gap:9px;margin-top:14px}.modal-actions button{flex:1;min-height:48px;border-radius:13px;font-size:14px;font-weight:750}.save-btn{background:#00b14f;color:#fff}.share-btn{background:#263443;color:#fff}.retake-btn{background:#ffffff12;color:#e3eaf2}.time-card{width:min(100%,370px);padding:22px}.time-card label{display:block;margin:0 0 8px;color:#aeb9c5;font-size:13px}.time-input{width:100%;height:54px;border:1px solid #ffffff22;border-radius:13px;background:#0a1017;color:#fff;padding:0 14px;font:600 22px ui-monospace,SFMono-Regular,Consolas,monospace}.time-help{font-size:12px;line-height:1.5;color:#8f9dad;margin:10px 0 16px}.time-actions{display:flex;gap:10px}.time-actions button{height:46px;flex:1;border-radius:12px;font-weight:700}.cancel-time{background:#ffffff11}.apply-time{background:#1976d2}
    @media(max-width:560px){.app{padding-left:12px;padding-right:12px;gap:8px}.topbar{min-height:42px}.brand-copy small{display:none}.brand-mark{width:32px;height:32px}.top-actions{gap:5px}.tool-btn{width:42px;padding:0}.tool-btn .tool-label{display:none}.stage{width:min(100%,calc((100dvh - 164px)*.75));border-radius:16px}.controls{min-height:76px;gap:13px}.mode-switch{height:48px}.mode-option{height:38px;min-width:88px;padding:0 13px;font-size:13px}.shutter{width:68px;height:68px;flex-basis:68px}.hint{font-size:10px;margin-top:-7px}}
    @media(max-height:650px) and (min-width:561px){.app{gap:5px;padding-top:7px;padding-bottom:7px}.stage{width:min(100%,calc((100dvh - 145px)*.75))}.topbar{min-height:38px}.controls{min-height:68px}.shutter{width:62px;height:62px;flex-basis:62px}.mode-switch{height:46px}.mode-option{height:36px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Timemark chấm công">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.2 19 6v5.4c0 4.5-2.9 7.8-7 9.4-4.1-1.6-7-4.9-7-9.4V6l7-2.8Z" stroke="white" stroke-width="1.8"/><path d="m8.5 11.8 2.2 2.2 4.8-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="brand-copy"><strong>Timemark</strong><small>Chấm công xác thực</small></div>
      </div>
      <div class="top-actions">
        <button class="tool-btn" id="flipBtn" type="button" aria-label="Lật camera" title="Lật camera"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4a8 8 0 0 1 7.3 4.7M19.3 4.8v3.9h-3.9M12 20a8 8 0 0 1-7.3-4.7M4.7 19.2v-3.9h3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9h6v6H9z" stroke="currentColor" stroke-width="1.5"/></svg><span class="tool-label">Lật camera</span></button>
        <button class="tool-btn" id="mapBtn" type="button" aria-label="Tải bản đồ cho chế độ hiện tại" title="Tải bản đồ"><svg viewBox="0 0 24 24" fill="none"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 3v15m6-12v15" stroke="currentColor" stroke-width="1.6"/></svg><span class="tool-label">Tải bản đồ</span></button>
        <button class="tool-btn primary" id="editBtn" type="button" aria-label="Chỉnh giờ bắt đầu" title="Chỉnh giờ bắt đầu"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="tool-label">Giờ bắt đầu</span></button>
      </div>
    </header>
    <section class="stage-wrap" aria-label="Khung ảnh điểm danh">
      <div class="stage" id="stage">
        <div class="camera-placeholder" id="placeholder">
          <div class="camera-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h3l1.4-2h7.2l1.4 2h3v11H4v-11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.6"/></svg></div>
          <h1>Bắt đầu điểm danh</h1><p>Bật camera để chụp ảnh cùng thời gian, địa điểm và thông tin ca làm.</p>
          <button class="start-camera" id="startCamera" type="button">Bật camera</button>
        </div>
        <video class="video-source" id="video" autoplay muted playsinline webkit-playsinline="true"></video>
        <canvas id="canvas" width="768" height="1024" aria-label="Ảnh chấm công Timemark"></canvas>
        <div class="status-toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="controls" aria-label="Điều khiển chấm công">
      <div class="mode-switch" role="group" aria-label="Chọn loại chấm công">
        <button class="mode-option active" data-mode="in" type="button" aria-pressed="true">Vào ca</button>
        <button class="mode-option" data-mode="out" type="button" aria-pressed="false">Tan ca</button>
      </div>
      <button class="shutter" id="shutter" type="button" aria-label="Chụp ảnh điểm danh"><span><svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h3l1.4-2h8.2l1.4 2h2v11H4v-11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.8"/></svg></span></button>
    </section>
    <div class="hint">Ảnh được tạo trên thiết bị của bạn</div>
    <input id="mapFile" type="file" accept="image/*" hidden>
  </main>
  <div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-card"><div class="modal-head"><h2 id="previewTitle">Ảnh điểm danh</h2><button class="close-btn" type="button" data-close="previewModal" aria-label="Đóng">×</button></div><img class="preview-image" id="previewImage" alt="Ảnh chấm công đã tạo"><div class="modal-actions"><button class="save-btn" id="saveBtn" type="button">Lưu ảnh</button><button class="share-btn" id="shareBtn" type="button">Chia sẻ</button><button class="retake-btn" id="retakeBtn" type="button">Chụp lại</button></div></div>
  </div>
  <div class="modal" id="timeModal" role="dialog" aria-modal="true" aria-labelledby="timeTitle">
    <div class="modal-card time-card"><div class="modal-head"><h2 id="timeTitle">Giờ bắt đầu ca</h2><button class="close-btn" type="button" data-close="timeModal" aria-label="Đóng">×</button></div><label for="timeInput">Nhập giờ bắt đầu</label><input class="time-input" id="timeInput" type="time" value="08:00"><p class="time-help">Giờ này sẽ được dùng để tính khoảng thời gian và tổng giờ làm khi chấm Tan ca.</p><div class="time-actions"><button class="cancel-time" type="button" data-close="timeModal">Hủy</button><button class="apply-time" id="applyTime" type="button">Lưu giờ</button></div></div>
  </div>
  <script>
  (()=>{
    'use strict';
    const W=768,H=1024,LS='timemark_clone_v1';
    const defaults={in:{accent:'#00B14F',badge:'Vào ca',address:'Võ Nguyên Giáp, P. An Biên, Thành Phố\nHải Phòng'},out:{accent:'#1976D2',badge:'Tan ca',address:'241 Nguyễn Công Hòa, Thành Phố Hải Phòng, P.\nAn Biên'}};
    let saved={};try{saved=JSON.parse(localStorage.getItem(LS)||'{}')}catch(_){saved={}}
    const cfg={in:{...defaults.in,...saved.in},out:{...defaults.out,...saved.out}};
    let mode='in',facing='user',stream=null,shiftStartMs=Number(saved.shiftStartMs)||null,overrideStartMs=Number(saved.overrideStartMs)||null,exportBlob=null,exportUrl=null,toastTimer=null;
    const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),placeholder=document.getElementById('placeholder');
    const maps={in:null,out:null};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const persist=()=>{try{localStorage.setItem(LS,JSON.stringify({in:cfg.in,out:cfg.out,shiftStartMs,overrideStartMs}))}catch(_){showToast('Không thể lưu cài đặt trên thiết bị.')}};
    function svgMap(kind){const out=kind==='out';const title=out?'NGUYỄN CÔNG HÒA':'VÕ NGUYÊN GIÁP';const cross=out?'TRẦN NGUYÊN HÃN':'THIÊN LÔI';return `<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380"><rect width="380" height="380" fill="#f5f2e9"/><path d="M-40 72 420 316M-40 260 350-40M20 420 410 35M-30 160 190-50M140 420 430 160" stroke="#fff" stroke-width="21"/><path d="M-40 72 420 316M-40 260 350-40M20 420 410 35M-30 160 190-50M140 420 430 160" stroke="#d9d6ce" stroke-width="2"/><path d="M42 0 305 380" stroke="#c7cdd2" stroke-width="23"/><path d="M42 0 305 380" stroke="#fff" stroke-width="16"/><path d="M150 185 296 145 233 277Z" fill="#35e5a0" opacity=".48"/><g fill="#59616a" font-family="Arial,sans-serif" font-size="15" font-weight="600"><text x="23" y="96" transform="rotate(-39 23 96)">${title}</text><text x="222" y="80" transform="rotate(39 222 80)">${cross}</text><text x="28" y="324">TỔ 30</text><text x="262" y="350">TỔ 31</text></g><g transform="translate(190 182)"><circle r="29" fill="#1A73E8" opacity=".17"/><path d="M0-32c-15 0-27 12-27 27 0 20 27 52 27 52S27 15 27-5C27-20 15-32 0-32Z" fill="#1687ed" stroke="white" stroke-width="5"/><circle cy="-5" r="9" fill="white"/></g></svg>`}
    function svgData(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
    function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
    async function initMaps(){for(const k of ['in','out']){try{maps[k]=saved['map_'+k]?await loadImage(saved['map_'+k]):await loadImage(svgData(svgMap(k)))}catch(_){maps[k]=await loadImage(svgData(svgMap(k)))}}}
    const pad=n=>String(n).padStart(2,'0');
    function timeText(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
    function currentStart(now=Date.now()){return overrideStartMs||shiftStartMs||now-(5*3600000+60000)}
    function duration(start,now){let mins=Math.max(0,Math.floor((now-start)/60000));return {hours:Math.floor(mins/60),minutes:mins%60}}
    function dateText(d){const days=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];return `${days[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`}
    function roundRect(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill()}
    function shield(c,x,y,size,color='#fff',check=true){c.save();c.translate(x,y);c.scale(size/24,size/24);c.beginPath();c.moveTo(12,2);c.lineTo(21,5.5);c.lineTo(21,12);c.quadraticCurveTo(20,19,12,22);c.quadraticCurveTo(4,19,3,12);c.lineTo(3,5.5);c.closePath();c.strokeStyle=color;c.lineWidth=1.8;c.stroke();if(check){c.beginPath();c.moveTo(7.5,12);c.lineTo(10.5,15);c.lineTo(16.8,8.7);c.strokeStyle=color;c.lineWidth=2;c.lineCap='round';c.lineJoin='round';c.stroke()}c.restore()}
    function drawMap(c,im){c.save();c.beginPath();c.roundRect(24,24,190,190,14);c.clip();c.fillStyle='#f5f2e9';c.fillRect(24,24,190,190);if(im){c.drawImage(im,24,24,190,190)}else{c.fillStyle='#e5e0d5';c.fillRect(24,24,190,190)}c.restore();c.save();c.beginPath();c.roundRect(24,24,190,190,14);c.strokeStyle='#ffffff';c.lineWidth=5;c.stroke();c.fillStyle='rgba(0,0,0,.65)';c.font='600 19px Arial,sans-serif';c.fillText(' Bản đồ',39,195);c.restore()}
    function drawPin(c){c.save();c.beginPath();c.arc(119,118,28,0,Math.PI*2);c.fillStyle='rgba(26,115,232,.18)';c.fill();c.beginPath();c.arc(119,118,17,0,Math.PI*2);c.fillStyle='#1A73E8';c.fill();c.beginPath();c.arc(119,118,8,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(119,118,28,0,Math.PI*2);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.stroke();c.restore()}
    function drawTextStroke(c,text,x,y){c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.72)';c.strokeText(text,x,y);c.fillStyle='#fff';c.fillText(text,x,y)}
    function render(now=Date.now()){
      if(!ctx)return;
      ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#252c34';ctx.fillRect(0,0,W,H);
      if(video.readyState>=2&&video.videoWidth){const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;ctx.save();if(facing==='user'){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore()}else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#364451');g.addColorStop(.55,'#19232d');g.addColorStop(1,'#10151c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(100+i*65,360+(i%3)*60,140,0,Math.PI*2);ctx.fill()}}
      const grad=ctx.createLinearGradient(0,650,0,1024);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.65)');ctx.fillStyle=grad;ctx.fillRect(0,650,W,374);
      const m=cfg[mode],offset=mode==='out'?-92:0,nowDate=new Date(now);drawMap(ctx,maps[mode]);drawPin(ctx);
      ctx.save();ctx.translate(748,480);ctx.rotate(-Math.PI/2);ctx.font='13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';drawTextStroke(ctx,`⛨ ${verification} Timemark Verified`,0,0);ctx.restore();
      const badgeY=805+offset;roundRect(ctx,24,badgeY,88,36,6,m.accent);ctx.fillStyle='#fff';ctx.font='bold 20px Arial,sans-serif';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText(m.badge,68,badgeY+18);
      roundRect(ctx,120,badgeY,96,36,6,'#fff');ctx.fillStyle='#1a1a1a';ctx.font='bold 24px Arial,sans-serif';ctx.fillText(timeText(now),168,badgeY+18);
      ctx.fillStyle=m.accent;ctx.fillRect(24,855+offset,4,88);
      ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle='#fff';ctx.font='600 20px Arial,sans-serif';ctx.fillText(dateText(nowDate),36,874+offset);
      ctx.font='19px Arial,sans-serif';const addr=m.address.split('\n');ctx.fillText(addr[0],36,906+offset);if(addr[1])ctx.fillText(addr[1],36,932+offset);
      shield(ctx,24,950+offset,25,'rgba(255,255,255,.88)',true);ctx.font='15px Arial,sans-serif';ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText('Cam kết ngày giờ chân thực bởi Timemark',58,975+offset);
      ctx.textAlign='right';ctx.font='14px Arial,sans-serif';ctx.fillStyle='#fff';ctx.fillText('Điểm danh',744,955+offset);ctx.font='bold 22px Arial,sans-serif';const timeWidth=ctx.measureText('Time').width,markWidth=ctx.measureText('mark').width;ctx.textAlign='left';ctx.fillStyle='#F5A623';ctx.fillText('Time',744-timeWidth-markWidth,982+offset);ctx.fillStyle='#fff';ctx.fillText('mark',744-markWidth,982+offset);
      if(mode==='out'){const start=currentStart(now),d=duration(start,now);ctx.fillStyle='#1565C0';ctx.fillRect(0,932,768,92);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='15px Arial,sans-serif';ctx.fillText('Đang làm việc',24,960);ctx.font='bold 32px Arial,sans-serif';ctx.fillStyle='#fff';ctx.fillText(`${timeText(start)} - ${timeText(now)}`,24,1002);ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='15px Arial,sans-serif';ctx.fillText('Làm việc',305,960);ctx.fillStyle='#fff';ctx.font='bold 32px Arial,sans-serif';ctx.fillText(String(d.hours),305,1002);let x=305+ctx.measureText(String(d.hours)).width+2;ctx.font='18px Arial,sans-serif';ctx.fillText('giờ ',x,1002);x+=ctx.measureText('giờ ').width;ctx.font='bold 32px Arial,sans-serif';ctx.fillText(String(d.minutes),x,1002);x+=ctx.measureText(String(d.minutes)).width+2;ctx.font='18px Arial,sans-serif';ctx.fillText('ph',x,1002)}
      ctx.textAlign='start';ctx.textBaseline='alphabetic';
    }
    const verification=Array.from({length:14},()=>String.fromCharCode(65+Math.floor(Math.random()*26))).join('');
    function loop(){render();requestAnimationFrame(loop)}
    function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4200)}
    function openModal(id){document.getElementById(id).classList.add('open')}
    function closeModal(id){document.getElementById(id).classList.remove('open')}
    function openTimeEditor(){const value=timeText(currentStart());document.getElementById('timeInput').value=value;openModal('timeModal');setTimeout(()=>document.getElementById('timeInput').focus(),100)}
    async function startCamera(){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast(location.protocol==='https:'||location.hostname==='localhost'?'Thiết bị hoặc trình duyệt này không hỗ trợ camera.':'Cần mở trang bằng HTTPS để sử dụng camera.');return}
      try{if(stream)stream.getTracks().forEach(t=>t.stop());const constraints={video:{facingMode:{ideal:facing},width:{ideal:1080},height:{ideal:1440},aspectRatio:{ideal:3/4}},audio:false};try{stream=await navigator.mediaDevices.getUserMedia(constraints)}catch(_){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}video.srcObject=stream;await video.play();placeholder.classList.add('hidden');showToast('Camera đã sẵn sàng. Chụp ảnh để tạo thẻ điểm danh.')}catch(err){let msg='Không thể mở camera. Hãy kiểm tra quyền truy cập camera của trình duyệt.';if(err&&err.name==='NotAllowedError'||err&&err.name==='SecurityError')msg=location.protocol==='https:'||location.hostname==='localhost'?'Quyền camera bị từ chối. Hãy cho phép camera trong cài đặt trình duyệt rồi thử lại.':'Camera cần quyền truy cập qua kết nối HTTPS.';else if(err&&err.name==='NotFoundError')msg='Không tìm thấy camera trên thiết bị này.';showToast(msg)}
    }
    function setMode(next){mode=next;document.querySelectorAll('.mode-option').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('editBtn').style.display=mode==='out'?'inline-flex':'none';render()}
    function makeName(){const d=new Date();return `timemark_${mode}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.jpg`}
    async function capture(){if(!stream||video.readyState<2){showToast('Trước tiên hãy bật camera để chụp ảnh.');return}const btn=document.getElementById('shutter');btn.classList.add('busy');if(mode==='in'){shiftStartMs=Date.now();overrideStartMs=null;persist()}render();canvas.toBlob(blob=>{btn.classList.remove('busy');if(!blob){showToast('Không thể tạo ảnh. Vui lòng thử lại.');return}exportBlob=blob;if(exportUrl)URL.revokeObjectURL(exportUrl);exportUrl=URL.createObjectURL(blob);document.getElementById('previewImage').src=exportUrl;openModal('previewModal')},'image/jpeg',.92)}
    async function saveImage(){if(!exportBlob)return;const name=makeName();try{const u=URL.createObjectURL(exportBlob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch(_){window.open(exportUrl,'_blank','noopener')} }
    async function shareImage(){if(!exportBlob)return;const file=new File([exportBlob],makeName(),{type:'image/jpeg'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Ảnh điểm danh Timemark'})}catch(err){if(err.name!=='AbortError')showToast('Không thể chia sẻ ảnh trên thiết bị này.')}}else{showToast('Chia sẻ tệp chưa được hỗ trợ. Hãy lưu ảnh rồi chia sẻ từ thư viện ảnh.')}}
    async function uploadMap(file){if(!file)return;try{const im=await loadImage(URL.createObjectURL(file));const c=document.createElement('canvas');c.width=500;c.height=500;const x=c.getContext('2d');const s=Math.max(500/im.width,500/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(500-w)/2,(500-h)/2,w,h);const data=c.toDataURL('image/jpeg',.8);maps[mode]=await loadImage(data);saved['map_'+mode]=data;persist();render();showToast(`Đã cập nhật bản đồ cho ${cfg[mode].badge}.`)}catch(_){showToast('Không đọc được ảnh bản đồ. Hãy thử một ảnh khác.')}}
    document.getElementById('startCamera').addEventListener('click',startCamera);document.getElementById('flipBtn').addEventListener('click',async()=>{facing=facing==='user'?'environment':'user';if(stream)await startCamera();else showToast(facing==='user'?'Camera trước sẽ được dùng khi bật camera.':'Camera sau sẽ được dùng khi bật camera.')});document.getElementById('mapBtn').addEventListener('click',()=>document.getElementById('mapFile').click());document.getElementById('mapFile').addEventListener('change',e=>{uploadMap(e.target.files[0]);e.target.value=''});document.getElementById('editBtn').addEventListener('click',openTimeEditor);document.querySelectorAll('.mode-option').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.getElementById('shutter').addEventListener('click',capture);document.getElementById('saveBtn').addEventListener('click',saveImage);document.getElementById('shareBtn').addEventListener('click',shareImage);document.getElementById('retakeBtn').addEventListener('click',()=>closeModal('previewModal'));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));document.getElementById('applyTime').addEventListener('click',()=>{const val=document.getElementById('timeInput').value;if(!val)return;const [h,min]=val.split(':').map(Number),d=new Date();d.setHours(h,min,0,0);overrideStartMs=d.getTime();persist();closeModal('timeModal');render();showToast(`Giờ bắt đầu đã đặt là ${val}.`)});canvas.addEventListener('click',e=>{if(mode!=='out')return;const r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*H/r.height;if(y>920&&y<1030)openTimeEditor()});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id))});window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
    setMode('in');initMaps().then(()=>render());requestAnimationFrame(loop);
  })();
  </script>
